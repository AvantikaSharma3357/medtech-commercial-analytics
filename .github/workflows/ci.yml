name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Regenerate data and confirm it matches the committed extracts
        run: |
          python data/generate_data.py
          git diff --exit-code data/raw
      - name: Data quality checks
        run: PYTHONPATH=src python -m mca.quality
      - name: Unit tests
        run: pytest -q
      - name: App smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=60).run()
          assert not at.exception, at.exception
          print("App rendered without errors")
          PY
